services:
  - type: web
    name: delcospot-api
    env: python
    plan: starter
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app
    healthCheckPath: /healthz

  # Runs scraper.py on a schedule to keep the incidents table fresh with
  # live data from the county dispatch feed. This is documented here for
  # reference, but was actually created manually in the Render dashboard
  # (New -> Cron Job) rather than via a Blueprint sync, matching how the
  # web service and database were set up. Needs the same DATABASE_URL
  # environment variable as delcospot-api.
  - type: cron
    name: delcospot-incident-scraper
    env: python
    plan: starter
    schedule: "*/2 * * * *"
    buildCommand: pip install -r requirements.txt
    startCommand: python scraper.py

  # Daily signup report (user_report.py): total users + anyone who signed up
  # in the last 24 hours, printed to this cron job's Logs tab. Like the
  # scraper, create it by hand in the Render dashboard (New -> Cron Job);
  # this entry is documentation. 12:00 UTC = 8am Eastern (7am in winter).
  # Needs the same DATABASE_URL environment variable as delcospot-api.
  - type: cron
    name: delcospot-daily-user-report
    env: python
    plan: starter
    schedule: "0 12 * * *"
    buildCommand: pip install -r requirements.txt
    startCommand: python user_report.py
